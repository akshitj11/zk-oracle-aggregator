[package]
name = "oracle-server"
description = "REST API for oracle proofs and resolution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oracle-server"
path = "src/main.rs"

[lib]
name = "oracle_server"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
oracle-core = { path = "../../crates/oracle-core" }
serde = { workspace = true, features = ["derive"] }
tokio.workspace = true
tower-http = { version = "0.7", features = ["trace", "limit"] }
tower = "0.5"
hex = "0.4"
toml.workspace = true
clap.workspace = true
sqlx.workspace = true
uuid.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
wiremock = "0.6"
tower = "0.5"
http-body-util = "0.1"
oracle-core = { path = "../../crates/oracle-core" }
serde_json.workspace = true
uuid.workspace = true

[lints]
workspace = true
